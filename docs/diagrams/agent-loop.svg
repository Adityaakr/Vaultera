<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Virgil', 'Segoe Print', 'Comic Sans MS', 'Caveat', cursive, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67700"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b8a3e"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1971c2"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c92a2a"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#fefefe" rx="12"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e" letter-spacing="0.5">Vaultera  Agent Decision Loop</text>

  <!-- Cycle start -->
  <rect x="340" y="58" width="220" height="44" rx="22" fill="#fff3bf" stroke="#fcc419" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#e67700">Cycle Begins</text>

  <line x1="450" y1="102" x2="450" y2="130" stroke="#e67700" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 1: Scheduled actions -->
  <rect x="280" y="133" width="340" height="50" rx="10" fill="#fff9db" stroke="#fcc419" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="314" y="154" font-size="12" font-weight="bold" fill="#e67700">`</text>
  <text x="340" y="154" font-size="13" font-weight="bold" fill="#333">Execute Due Scheduled Actions</text>
  <text x="450" y="172" text-anchor="middle" font-size="10" fill="#555">Deferred allocations from previous cycles</text>

  <line x1="450" y1="183" x2="450" y2="205" stroke="#e67700" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 2: Arena check -->
  <rect x="280" y="208" width="340" height="50" rx="10" fill="#fff9db" stroke="#fcc419" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="314" y="229" font-size="12" font-weight="bold" fill="#e67700">a</text>
  <text x="340" y="229" font-size="13" font-weight="bold" fill="#333">Check Arena State</text>
  <text x="450" y="247" text-anchor="middle" font-size="10" fill="#555">Find open rounds · Resolve completed rounds (LLM as judge)</text>

  <line x1="450" y1="258" x2="450" y2="280" stroke="#e67700" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 3: Read state -->
  <rect x="280" y="283" width="340" height="50" rx="10" fill="#ebfbee" stroke="#69db7c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="314" y="304" font-size="12" font-weight="bold" fill="#2b8a3e">b</text>
  <text x="340" y="304" font-size="13" font-weight="bold" fill="#333">Read On-Chain Vault State</text>
  <text x="450" y="322" text-anchor="middle" font-size="10" fill="#555">TVL · idle USDC · strategy balances · arena positions</text>

  <line x1="450" y1="333" x2="450" y2="355" stroke="#e67700" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 4: LLM -->
  <rect x="240" y="358" width="420" height="64" rx="10" fill="#f3f0ff" stroke="#b197fc" stroke-width="2" filter="url(#shadow)"/>
  <text x="274" y="382" font-size="12" font-weight="bold" fill="#7048e8">c</text>
  <text x="300" y="382" font-size="13" font-weight="bold" fill="#333">Query Agentic LLM</text>
  <text x="450" y="400" text-anchor="middle" font-size="10" fill="#555">System prompt (persona + constraints) + user msg (vault state)</text>
  <text x="450" y="414" text-anchor="middle" font-size="10" fill="#555">’ Returns: { actions: [...], reasoning: "..." }</text>

  <line x1="450" y1="422" x2="450" y2="446" stroke="#e67700" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 5: Execute -->
  <rect x="240" y="449" width="420" height="64" rx="10" fill="#ebfbee" stroke="#69db7c" stroke-width="2" filter="url(#shadow)"/>
  <text x="274" y="473" font-size="12" font-weight="bold" fill="#2b8a3e">d</text>
  <text x="300" y="473" font-size="13" font-weight="bold" fill="#333">Execute Actions On-Chain</text>
  <text x="450" y="491" text-anchor="middle" font-size="10" fill="#555">allocate · deallocate · arena open/accept (immediate or scheduled)</text>
  <text x="450" y="505" text-anchor="middle" font-size="10" fill="#555">vault.executeAction() ’ AgentAction event emitted</text>

  <line x1="450" y1="513" x2="450" y2="537" stroke="#e67700" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 6: Publish HCS -->
  <rect x="280" y="540" width="340" height="50" rx="10" fill="#e7f5ff" stroke="#74c0fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="314" y="561" font-size="12" font-weight="bold" fill="#1971c2">e</text>
  <text x="340" y="561" font-size="13" font-weight="bold" fill="#333">Publish Reasoning to HCS</text>
  <text x="450" y="579" text-anchor="middle" font-size="10" fill="#555">Immutable record on Hedera Consensus Service</text>

  <!-- Loop back arrow -->
  <path d="M 620 565 Q 780 565, 780 85 Q 780 55, 560 80" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#ar)"/>
  <text x="790" y="320" font-size="11" fill="#c92a2a" font-weight="bold" transform="rotate(90, 790, 320)">Sleep ’ Next Cycle</text>

  <!-- Side annotations -->
  <rect x="36" y="360" width="180" height="64" rx="8" fill="#f1f3f5" stroke="#ced4da" stroke-width="1"/>
  <text x="126" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Model-Agnostic</text>
  <text x="126" y="398" text-anchor="middle" font-size="10" fill="#868e96">Pluggable LLM backend</text>
  <text x="126" y="414" text-anchor="middle" font-size="10" fill="#868e96">OpenAI-compatible API</text>
  <line x1="216" y1="392" x2="238" y2="390" stroke="#ced4da" stroke-width="1.5" marker-end="url(#a)"/>
</svg>

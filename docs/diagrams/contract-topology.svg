<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Virgil', 'Segoe Print', 'Comic Sans MS', 'Caveat', cursive, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b8a3e"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#fefefe" rx="12"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e" letter-spacing="0.5">Vaultera  Contract Topology</text>

  <!-- Users -->
  <rect x="360" y="60" width="180" height="44" rx="22" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">Users (MetaMask)</text>

  <!-- deposit/withdraw arrows -->
  <line x1="410" y1="104" x2="200" y2="158" stroke="#1971c2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="104" x2="450" y2="158" stroke="#1971c2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="104" x2="700" y2="158" stroke="#1971c2" stroke-width="2" marker-end="url(#a)"/>
  <text x="285" y="130" font-size="9" fill="#1971c2">deposit / withdraw</text>
  <text x="455" y="136" font-size="9" fill="#1971c2">deposit / withdraw</text>
  <text x="585" y="130" font-size="9" fill="#1971c2">deposit / withdraw</text>

  <!-- Vaults row -->
  <rect x="80" y="160" width="240" height="80" rx="12" fill="#ebfbee" stroke="#69db7c" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b8a3e">Vault 1</text>
  <text x="200" y="206" text-anchor="middle" font-size="11" fill="#555">HBAR Treasury Core</text>
  <text x="200" y="224" text-anchor="middle" font-size="9" fill="#868e96">Agent: Atlas · vaHBAR shares</text>

  <rect x="330" y="160" width="240" height="80" rx="12" fill="#ebfbee" stroke="#69db7c" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b8a3e">Vault 2</text>
  <text x="450" y="206" text-anchor="middle" font-size="11" fill="#555">StableFlow Income</text>
  <text x="450" y="224" text-anchor="middle" font-size="9" fill="#868e96">Agent: Echo · vaSFI shares</text>

  <rect x="580" y="160" width="240" height="80" rx="12" fill="#ebfbee" stroke="#69db7c" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b8a3e">Vault 3</text>
  <text x="700" y="206" text-anchor="middle" font-size="11" fill="#555">Momentum Alpha</text>
  <text x="700" y="224" text-anchor="middle" font-size="9" fill="#868e96">Agent: Meridian · vaMALPHA shares</text>

  <!-- Agent -->
  <rect x="730" y="280" width="140" height="44" rx="22" fill="#fff3bf" stroke="#fcc419" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="307" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67700">AI Agent</text>

  <!-- Agent arrows to vaults -->
  <line x1="730" y1="296" x2="320" y2="234" stroke="#e67700" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <line x1="762" y1="280" x2="570" y2="234" stroke="#e67700" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <line x1="800" y1="280" x2="770" y2="240" stroke="#e67700" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="616" y="265" font-size="9" fill="#e67700">allocate · execute · arena</text>

  <!-- Strategies row -->
  <rect x="60" y="290" width="180" height="70" rx="10" fill="#d3f9d8" stroke="#69db7c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b8a3e">StableLending</text>
  <text x="150" y="334" text-anchor="middle" font-size="10" fill="#555">USDC yield strategy</text>
  <text x="150" y="349" text-anchor="middle" font-size="9" fill="#868e96">4.8% APY</text>

  <rect x="260" y="290" width="180" height="70" rx="10" fill="#d3f9d8" stroke="#69db7c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b8a3e">MomentumPool</text>
  <text x="350" y="334" text-anchor="middle" font-size="10" fill="#555">USDC yield strategy</text>
  <text x="350" y="349" text-anchor="middle" font-size="9" fill="#868e96">8.1% APY</text>

  <rect x="460" y="290" width="180" height="70" rx="10" fill="#d3f9d8" stroke="#69db7c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b8a3e">YieldFarm</text>
  <text x="550" y="334" text-anchor="middle" font-size="10" fill="#555">USDC yield strategy</text>
  <text x="550" y="349" text-anchor="middle" font-size="9" fill="#868e96">5.9% APY</text>

  <!-- Vault ’ Strategy arrows -->
  <line x1="200" y1="240" x2="150" y2="288" stroke="#2b8a3e" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="350" y1="240" x2="350" y2="288" stroke="#2b8a3e" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="550" y1="240" x2="550" y2="288" stroke="#2b8a3e" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="140" y="270" font-size="9" fill="#2b8a3e">USDC</text>
  <text x="356" y="270" font-size="9" fill="#2b8a3e">USDC</text>
  <text x="556" y="270" font-size="9" fill="#2b8a3e">USDC</text>

  <!-- Arena -->
  <rect x="160" y="408" width="340" height="80" rx="12" fill="#ffe3e3" stroke="#ff8787" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="436" text-anchor="middle" font-size="14" font-weight="bold" fill="#c92a2a">Arena</text>
  <text x="330" y="454" text-anchor="middle" font-size="11" fill="#555">Vault A stakes USDC ” Vault B stakes USDC</text>
  <text x="330" y="472" text-anchor="middle" font-size="10" fill="#868e96">Winner takes 90% · 10% protocol fee</text>

  <!-- Vault ’ Arena -->
  <line x1="200" y1="240" x2="240" y2="406" stroke="#c92a2a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <line x1="700" y1="240" x2="420" y2="406" stroke="#c92a2a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="160" y="382" font-size="9" fill="#c92a2a">open round</text>
  <text x="485" y="382" font-size="9" fill="#c92a2a">accept round</text>

  <!-- Token contracts -->
  <rect x="580" y="408" width="120" height="50" rx="10" fill="#e7f5ff" stroke="#74c0fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#1864ab">USDC</text>
  <text x="640" y="446" text-anchor="middle" font-size="9" fill="#555">ERC20 test token</text>

  <rect x="720" y="408" width="120" height="50" rx="10" fill="#e7f5ff" stroke="#74c0fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="780" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#1864ab">vaUSD</text>
  <text x="780" y="446" text-anchor="middle" font-size="9" fill="#555">Wrapped stablecoin</text>

  <!-- Legend -->
  <rect x="60" y="478" width="780" height="30" rx="6" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  <circle cx="90" cy="493" r="6" fill="#e7f5ff" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="102" y="497" font-size="10" fill="#555">User interaction</text>
  <circle cx="220" cy="493" r="6" fill="#fff3bf" stroke="#fcc419" stroke-width="1.5"/>
  <text x="232" y="497" font-size="10" fill="#555">Agent-controlled</text>
  <circle cx="370" cy="493" r="6" fill="#ebfbee" stroke="#69db7c" stroke-width="1.5"/>
  <text x="382" y="497" font-size="10" fill="#555">Smart contracts</text>
  <circle cx="510" cy="493" r="6" fill="#ffe3e3" stroke="#ff8787" stroke-width="1.5"/>
  <text x="522" y="497" font-size="10" fill="#555">Competitive arena</text>
  <line x1="640" y1="493" x2="670" y2="493" stroke="#e67700" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="678" y="497" font-size="10" fill="#555">Agent actions</text>
  <line x1="770" y1="493" x2="800" y2="493" stroke="#1971c2" stroke-width="2"/>
  <text x="808" y="497" font-size="10" fill="#555">User txs</text>
</svg>

  <text x="80" y="356" font-size="12" font-weight="bold" fill="#2b8a3e">Smart Contracts (Solidity 0.8.20)</text>

  <!-- Vault boxes -->
  <rect x="80" y="368" width="200" height="72" rx="8" fill="#fff" stroke="#51cf66" stroke-width="1.5"/>
  <text x="180" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b8a3e">Vault ×3</text>
  <text x="180" y="407" text-anchor="middle" font-size="10" fill="#555">deposit() · withdraw()</text>
  <text x="180" y="422" text-anchor="middle" font-size="10" fill="#555">allocate() · executeAction()</text>
  <text x="180" y="435" text-anchor="middle" font-size="9" fill="#868e96">ERC20 share tokens</text>

  <!-- Strategy boxes -->
  <rect x="310" y="368" width="210" height="72" rx="8" fill="#fff" stroke="#51cf66" stroke-width="1.5"/>
  <text x="415" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b8a3e">Strategy ×3</text>
  <text x="415" y="407" text-anchor="middle" font-size="10" fill="#555">StableLending</text>
  <text x="415" y="422" text-anchor="middle" font-size="10" fill="#555">MomentumPool · YieldFarm</text>
  <text x="415" y="435" text-anchor="middle" font-size="9" fill="#868e96">USDC yield bookkeeping</text>

  <!-- Arrow: Vault ’ Strategy -->
  <line x1="280" y1="404" x2="308" y2="404" stroke="#2b8a3e" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Arena -->
  <rect x="80" y="458" width="200" height="55" rx="8" fill="#fff" stroke="#51cf66" stroke-width="1.5"/>
  <text x="180" y="480" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b8a3e">Arena</text>
  <text x="180" y="498" text-anchor="middle" font-size="10" fill="#555">Vault-vs-vault staking · 90/10 split</text>


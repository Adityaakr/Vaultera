<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="'Virgil', 'Segoe Print', 'Comic Sans MS', 'Caveat', cursive, sans-serif">
  <defs>
    <filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b8a3e"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1971c2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="#fefefe" rx="12"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e" letter-spacing="0.5">Vaultera  System Architecture</text>

  <!-- PPP FRONTEND LAYER PPP -->
  <rect x="40" y="58" width="1020" height="180" rx="16" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2" filter="url(#shadow)" stroke-dasharray="8 4"/>
  <text x="60" y="84" font-size="13" font-weight="bold" fill="#1971c2" letter-spacing="1">FRONTEND</text>
  <text x="168" y="84" font-size="11" fill="#5c7cfa">React 18 · TypeScript · Tailwind</text>

  <!-- Frontend modules -->
  <rect x="60" y="98" width="140" height="52" rx="10" fill="#d0ebff" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="130" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#1864ab">Vault Dashboard</text>
  <text x="130" y="138" text-anchor="middle" font-size="10" fill="#4a6fa5">TVL · Deposit · Withdraw</text>

  <rect x="220" y="98" width="140" height="52" rx="10" fill="#d0ebff" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="290" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#1864ab">Agent Monitor</text>
  <text x="290" y="138" text-anchor="middle" font-size="10" fill="#4a6fa5">Decisions · Reasoning</text>

  <rect x="380" y="98" width="140" height="52" rx="10" fill="#d0ebff" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="450" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#1864ab">Arena</text>
  <text x="450" y="138" text-anchor="middle" font-size="10" fill="#4a6fa5">Rounds · Staking</text>

  <rect x="540" y="98" width="155" height="52" rx="10" fill="#d0ebff" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="617" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#1864ab">Live Performance</text>
  <text x="617" y="138" text-anchor="middle" font-size="10" fill="#4a6fa5">Sparklines · Ticking</text>

  <rect x="715" y="98" width="140" height="52" rx="10" fill="#d0ebff" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="785" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#1864ab">Activity Feed</text>
  <text x="785" y="138" text-anchor="middle" font-size="10" fill="#4a6fa5">On-chain Events</text>

  <rect x="875" y="98" width="165" height="52" rx="10" fill="#d0ebff" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="957" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#1864ab">Portfolio</text>
  <text x="957" y="138" text-anchor="middle" font-size="10" fill="#4a6fa5">Positions · Returns</text>


  <line x1="280" y1="220" x2="280" y2="290" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow-blue)" stroke-dasharray="6 3"/>
  <line x1="780" y1="220" x2="780" y2="290" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow-blue)" stroke-dasharray="6 3"/>

  <!-- PPP HEDERA LAYER PPP -->
  <rect x="40" y="290" width="1020" height="290" rx="16" fill="#ebfbee" stroke="#69db7c" stroke-width="2" filter="url(#shadow)" stroke-dasharray="8 4"/>
  <text x="60" y="316" font-size="13" font-weight="bold" fill="#2b8a3e" letter-spacing="1">HEDERA NETWORK</text>
  <text x="218" y="316" font-size="11" fill="#40c057">EVM · HCS · Mirror Node</text>


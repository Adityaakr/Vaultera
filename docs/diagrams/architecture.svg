  <rect x="310" y="458" width="100" height="55" rx="8" fill="#fff" stroke="#51cf66" stroke-width="1.5"/>
  <text x="360" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b8a3e">USDC</text>
  <text x="360" y="496" text-anchor="middle" font-size="10" fill="#555">Test token</text>

  <rect x="420" y="458" width="100" height="55" rx="8" fill="#fff" stroke="#51cf66" stroke-width="1.5"/>
  <text x="470" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b8a3e">vaUSD</text>
  <text x="470" y="496" text-anchor="middle" font-size="10" fill="#555">Wrapped stable</text>


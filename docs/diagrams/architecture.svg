  <text x="130" y="703" text-anchor="middle" font-size="10" fill="#555">Conservative Macro</text>
  <text x="130" y="718" text-anchor="middle" font-size="10" fill="#555">Low risk</text>
  <rect x="85" y="728" width="90" height="16" rx="4" fill="#2b8a3e22" stroke="#2b8a3e" stroke-width="0.8"/>
  <text x="130" y="740" text-anchor="middle" font-size="9" fill="#2b8a3e">Treasury Core</text>
  <rect x="85" y="748" width="90" height="16" rx="4" fill="#1971c222" stroke="#1971c2" stroke-width="0.8"/>
  <text x="130" y="760" text-anchor="middle" font-size="9" fill="#1971c2">Trust: 97</text>

  <rect x="220" y="662" width="140" height="120" rx="10" fill="#fff9db" stroke="#fcc419" stroke-width="1.5"/>
  <text x="290" y="686" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67700">Meridian</text>
  <text x="290" y="703" text-anchor="middle" font-size="10" fill="#555">Dynamic Momentum</text>
  <text x="290" y="718" text-anchor="middle" font-size="10" fill="#555">Moderate risk</text>
  <rect x="245" y="728" width="90" height="16" rx="4" fill="#2b8a3e22" stroke="#2b8a3e" stroke-width="0.8"/>
  <text x="290" y="740" text-anchor="middle" font-size="9" fill="#2b8a3e">Momentum Alpha</text>
  <rect x="245" y="748" width="90" height="16" rx="4" fill="#1971c222" stroke="#1971c2" stroke-width="0.8"/>
  <text x="290" y="760" text-anchor="middle" font-size="9" fill="#1971c2">Trust: 92</text>

  <rect x="380" y="662" width="140" height="120" rx="10" fill="#fff9db" stroke="#fcc419" stroke-width="1.5"/>
  <text x="450" y="686" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67700">Echo</text>
  <text x="450" y="703" text-anchor="middle" font-size="10" fill="#555">Adaptive Yield</text>
  <text x="450" y="718" text-anchor="middle" font-size="10" fill="#555">Low risk</text>
  <rect x="405" y="728" width="90" height="16" rx="4" fill="#2b8a3e22" stroke="#2b8a3e" stroke-width="0.8"/>
  <text x="450" y="740" text-anchor="middle" font-size="9" fill="#2b8a3e">StableFlow</text>
  <rect x="405" y="748" width="90" height="16" rx="4" fill="#1971c222" stroke="#1971c2" stroke-width="0.8"/>
  <text x="450" y="760" text-anchor="middle" font-size="9" fill="#1971c2">Trust: 95</text>

  <!-- Decision engine -->
  <rect x="560" y="662" width="260" height="120" rx="10" fill="#fff9db" stroke="#fcc419" stroke-width="1.5"/>
  <text x="690" y="686" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67700">Decision Engine</text>
  <text x="690" y="706" text-anchor="middle" font-size="10" fill="#555">1. Read on-chain vault state</text>
  <text x="690" y="721" text-anchor="middle" font-size="10" fill="#555">2. Query agentic LLM</text>
  <text x="690" y="736" text-anchor="middle" font-size="10" fill="#555">3. Parse structured response</text>
  <text x="690" y="751" text-anchor="middle" font-size="10" fill="#555">4. Execute + log on-chain</text>
  <text x="690" y="766" text-anchor="middle" font-size="10" fill="#555">5. Publish reasoning to HCS</text>

  <!-- LLM block -->
  <rect x="850" y="662" width="190" height="120" rx="10" fill="#fff9db" stroke="#fcc419" stroke-width="1.5"/>
  <text x="945" y="686" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67700">LLM Backend</text>
  <text x="945" y="708" text-anchor="middle" font-size="10" fill="#555">High-performance agentic</text>
  <text x="945" y="723" text-anchor="middle" font-size="10" fill="#555">models via OpenAI-compat</text>
  <text x="945" y="738" text-anchor="middle" font-size="10" fill="#555">API. Structured JSON output</text>
  <text x="945" y="753" text-anchor="middle" font-size="10" fill="#555">with actions + reasoning.</text>
  <rect x="880" y="760" width="130" height="16" rx="4" fill="#e67700" stroke="none"/>
  <text x="945" y="772" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">Model-agnostic runtime</text>

  <!-- Arrow: Decision ’ LLM -->
  <line x1="820" y1="722" x2="848" y2="722" stroke="#e67700" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Arrows: Agent ’ Hedera -->
  <line x1="280" y1="662" x2="280" y2="582" stroke="#e67700" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 3"/>
  <text x="288" y="624" font-size="10" fill="#e67700" font-style="italic">execute txs</text>

  <line x1="690" y1="662" x2="690" y2="560" stroke="#e67700" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 3"/>
  <text x="698" y="616" font-size="10" fill="#e67700" font-style="italic">publish to HCS</text>

  <!-- User icon -->
  <rect x="460" y="252" width="80" height="30" rx="6" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="500" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Users</text>
  <line x1="500" y1="252" x2="500" y2="238" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="508" y="248" font-size="9" fill="#868e96">MetaMask</text>

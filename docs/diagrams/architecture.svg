  <rect x="590" y="372" width="200" height="50" rx="8" fill="#fff" stroke="#51cf66" stroke-width="1.5"/>
  <text x="690" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b8a3e">Topic: Atlas</text>
  <text x="690" y="410" text-anchor="middle" font-size="10" fill="#555">Immutable decision log</text>

  <rect x="590" y="432" width="200" height="50" rx="8" fill="#fff" stroke="#51cf66" stroke-width="1.5"/>
  <text x="690" y="453" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b8a3e">Topic: Meridian</text>
  <text x="690" y="470" text-anchor="middle" font-size="10" fill="#555">Immutable decision log</text>

  <rect x="590" y="492" width="200" height="50" rx="8" fill="#fff" stroke="#51cf66" stroke-width="1.5"/>
  <text x="690" y="513" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b8a3e">Topic: Echo</text>
  <text x="690" y="530" text-anchor="middle" font-size="10" fill="#555">Immutable decision log</text>

  <!-- HCS description -->
  <text x="830" y="395" font-size="11" fill="#555" font-style="italic">Every agent decision</text>
  <text x="830" y="412" font-size="11" fill="#555" font-style="italic">is published as an</text>
  <text x="830" y="429" font-size="11" fill="#555" font-style="italic">immutable, timestamped</text>
  <text x="830" y="446" font-size="11" fill="#555" font-style="italic">HCS message  publicly</text>
  <text x="830" y="463" font-size="11" fill="#555" font-style="italic">auditable forever.</text>


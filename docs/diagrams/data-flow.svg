<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Virgil', 'Segoe Print', 'Comic Sans MS', 'Caveat', cursive, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b8a3e"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67700"/>
    </marker>
    <marker id="arr-b" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1971c2"/>
    </marker>
  </defs>

  <rect width="900" height="700" fill="#fefefe" rx="12"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e" letter-spacing="0.5">Vaultera  Data Flow</text>

  <!-- Step 1: User deposits -->
  <rect x="320" y="60" width="260" height="60" rx="12" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1864ab">User Deposits Capital</text>
  <text x="450" y="104" text-anchor="middle" font-size="11" fill="#4a6fa5">USDC · vaUSD · HBAR ’ Vault contract</text>

  <!-- Arrow -->
  <line x1="450" y1="120" x2="450" y2="152" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: Vault holds -->
  <rect x="270" y="155" width="360" height="60" rx="12" fill="#ebfbee" stroke="#69db7c" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b8a3e">Vault Holds Capital On-Chain</text>
  <text x="450" y="199" text-anchor="middle" font-size="11" fill="#555">ERC20 shares minted · TVL tracked · Idle balance ready</text>

  <!-- Arrow -->
  <line x1="450" y1="215" x2="450" y2="247" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Agent reads -->
  <rect x="230" y="250" width="440" height="60" rx="12" fill="#fff3bf" stroke="#fcc419" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#e67700">Agent Reads Vault State</text>
  <text x="450" y="294" text-anchor="middle" font-size="11" fill="#555">TVL · idle balance · deployed capital · strategy allocations · arena rounds</text>

  <!-- Arrow -->
  <line x1="450" y1="310" x2="450" y2="342" stroke="#e67700" stroke-width="2" marker-end="url(#arr-o)"/>

  <!-- Step 4: LLM query -->
  <rect x="230" y="345" width="440" height="70" rx="12" fill="#fff3bf" stroke="#fcc419" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#e67700">LLM Generates Decision</text>
  <text x="450" y="390" text-anchor="middle" font-size="11" fill="#555">Agent persona + vault context ’ structured JSON response</text>
  <text x="450" y="406" text-anchor="middle" font-size="10" fill="#868e96">{ "actions": [...], "reasoning": "Given current TVL and risk profile..." }</text>

  <!-- Split into two paths -->
  <line x1="350" y1="415" x2="200" y2="465" stroke="#2b8a3e" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="550" y1="415" x2="700" y2="465" stroke="#1971c2" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Left path: On-chain execution -->
  <rect x="60" y="468" width="280" height="100" rx="12" fill="#ebfbee" stroke="#69db7c" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="494" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b8a3e">On-Chain Execution</text>
  <text x="200" y="514" text-anchor="middle" font-size="11" fill="#555">allocateToStrategy()</text>
  <text x="200" y="530" text-anchor="middle" font-size="11" fill="#555">deallocateFromStrategy()</text>
  <text x="200" y="546" text-anchor="middle" font-size="11" fill="#555">openArenaRound() · executeAction()</text>
  <text x="200" y="562" text-anchor="middle" font-size="9" fill="#868e96">’ emits events (permanent record)</text>

  <!-- Right path: HCS publish -->
  <rect x="560" y="468" width="280" height="100" rx="12" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="494" text-anchor="middle" font-size="14" font-weight="bold" fill="#1864ab">Publish to HCS</text>
  <text x="700" y="514" text-anchor="middle" font-size="11" fill="#555">Full reasoning + actions JSON</text>
  <text x="700" y="530" text-anchor="middle" font-size="11" fill="#555">’ immutable consensus topic</text>
  <text x="700" y="546" text-anchor="middle" font-size="11" fill="#555">’ timestamped by network</text>
  <text x="700" y="562" text-anchor="middle" font-size="9" fill="#868e96">Publicly auditable forever</text>

  <!-- Merge back -->
  <line x1="200" y1="568" x2="350" y2="612" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="700" y1="568" x2="550" y2="612" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 6: Frontend reads -->
  <rect x="260" y="615" width="380" height="70" rx="12" fill="#f3f0ff" stroke="#b197fc" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="641" text-anchor="middle" font-size="14" font-weight="bold" fill="#7048e8">Frontend Renders Everything</text>
  <text x="450" y="660" text-anchor="middle" font-size="11" fill="#555">Contract state via RPC · Event logs via Mirror Node</text>
  <text x="450" y="676" text-anchor="middle" font-size="11" fill="#555">HCS messages via Mirror · Real-time 1s yield simulation</text>

  <!-- Labels on paths -->
  <text x="82" y="456" font-size="10" fill="#2b8a3e" font-weight="bold">EXECUTE</text>
  <text x="740" y="456" font-size="10" fill="#1971c2" font-weight="bold">LOG</text>
</svg>
